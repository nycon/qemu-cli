name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUT="qemu-cli_${VERSION}_${GOOS}_${GOARCH}${EXT}"
          go build -trimpath -ldflags "-s -w -X github.com/nycon/qemu-cli/cmd.Version=${VERSION}" -o "dist/${OUT}" .
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "${OUT%.exe}.zip" "$OUT"
          else
            tar -czf "${OUT}.tar.gz" "$OUT"
          fi
          sha256sum "${OUT}"* > "${OUT}.sha256" 2>/dev/null || shasum -a 256 "${OUT}"* > "${OUT}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
